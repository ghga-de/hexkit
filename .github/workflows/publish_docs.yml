name: Publish docs via GH pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment,
# skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

# hexkit has moved into the GHGA monorepo (https://github.com/ghga-de/ghga, under
# libs/hexkit), which now builds and publishes this documentation to
# https://ghga-de.github.io/ghga/hexkit/. This repository is being archived, but its
# Pages site has to keep resolving, because the old URL is part of the immutable PyPI
# metadata of hexkit 9.0.0 and 9.0.1.
#
# Archiving disables Actions while leaving Pages serving the last deployment, so this
# workflow no longer builds the docs: it deploys a two-page redirect site, whose
# 404.html rewrites any requested path onto the new site. That deploy is the final one
# and cannot be redone, which is why it depends on nothing but Python's standard
# library — no great-docs, no Quarto, no dependency lock that has to keep resolving.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate redirect site
        run: ./scripts/generate_redirect_site.py ./_redirect_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_redirect_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
